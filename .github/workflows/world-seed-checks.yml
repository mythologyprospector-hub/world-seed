name: world-seed quality checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "23 8 * * 1"

permissions:
  contents: read

# A PR gets one current check at a time; superseded runs are cancelled.
# Do not also run push checks on the feature branch: pull_request already covers it.
concurrency:
  group: world-seed-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate seed structure and tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
      - name: Check shell script syntax
        run: bash -n scripts/prepare_local_handoff_backup.sh
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run dependency-free structural checks
        run: python scripts/validate_seed.py
      - name: Install schema validation dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Validate the canonical audit finding template
        run: python scripts/validate_audit_findings.py templates/audit-finding.template.json
      - name: Validate template against the full JSON Schema
        run: python scripts/validate_audit_schema.py templates/audit-finding.template.json
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
