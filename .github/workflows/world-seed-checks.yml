name: world-seed quality checks

on:
  pull_request:
  push:
    branches:
      - main
      - build/world-seed-foundation
  workflow_dispatch:
  schedule:
    - cron: "23 8 * * 1"

permissions:
  contents: read

concurrency:
  group: world-seed-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate seed structure and tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run dependency-free structural checks
        run: python scripts/validate_seed.py
      - name: Validate the canonical audit finding template
        run: python scripts/validate_audit_findings.py templates/audit-finding.template.json
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
