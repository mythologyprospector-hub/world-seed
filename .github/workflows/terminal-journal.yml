name: Terminal Journal Tests

on:
  pull_request:
    paths:
      - "scripts/terminal_journal.py"
      - "tests/test_terminal_journal.py"
      - "scripts/terminal_handoff.py"
      - "tests/test_terminal_handoff.py"
      - "scripts/terminal_session.py"
      - "tests/test_terminal_session.py"
      - "scripts/prepare_interactive_handoff.py"
      - "tests/test_prepare_interactive_handoff.py"
      - "TERMINAL_JOURNAL.md"
      - "scripts/world_seed_see.py"
      - "tests/test_world_seed_see.py"
      - "WORLD_SEED_SEE.md"
      - ".github/workflows/terminal-journal.yml"
  push:
    branches:
      - "feat/world-seed-see-minimal"
    paths:
      - "scripts/terminal_journal.py"
      - "tests/test_terminal_journal.py"
      - "TERMINAL_JOURNAL.md"
      - "scripts/world_seed_see.py"
      - "tests/test_world_seed_see.py"
      - "WORLD_SEED_SEE.md"
      - ".github/workflows/terminal-journal.yml"

permissions:
  contents: read

jobs:
  terminal-journal:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest for PTY and handoff tests
        run: python -m pip install pytest
      - name: Run local terminal journal tests
        run: |
          python -m unittest discover -s tests -p 'test_terminal_journal.py' -v
          python -m unittest discover -s tests -p 'test_terminal_handoff.py' -v
          python -m unittest discover -s tests -p 'test_world_seed_see.py' -v
          python -m pytest -q tests/test_prepare_interactive_handoff.py tests/test_terminal_session.py
