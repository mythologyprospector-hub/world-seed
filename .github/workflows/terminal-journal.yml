name: Terminal Journal Tests

on:
  pull_request:
    paths:
      - "scripts/terminal_journal.py"
      - "scripts/build_recovery_capsule.py"
      - "scripts/audit_recovery_state.py"
      - "scripts/propose_recovery_state_refresh.py"
      - "scripts/render_recovery_brief.py"
      - "requirements-dev.txt"
      - "tests/test_terminal_journal.py"
      - "tests/test_recovery_capsule.py"
      - "schemas/recovery-project-state.schema.json"
      - "templates/recovery-project-state.template.json"
      - "tests/test_recovery_project_state.py"
      - "tests/test_recovery_state_audit.py"
      - "tests/test_recovery_state_refresh.py"
      - "tests/test_recovery_brief.py"
      - ".github/workflows/terminal-journal.yml"
  push:
    branches:
      - "feat/durable-terminal-journal"
    paths:
      - "scripts/terminal_journal.py"
      - "scripts/build_recovery_capsule.py"
      - "scripts/audit_recovery_state.py"
      - "scripts/propose_recovery_state_refresh.py"
      - "scripts/render_recovery_brief.py"
      - "tests/test_terminal_journal.py"
      - "tests/test_recovery_capsule.py"
      - "schemas/recovery-project-state.schema.json"
      - "templates/recovery-project-state.template.json"
      - "tests/test_recovery_project_state.py"
      - "tests/test_recovery_state_audit.py"
      - "tests/test_recovery_state_refresh.py"
      - "tests/test_recovery_brief.py"
      - ".github/workflows/terminal-journal.yml"

permissions:
  contents: read

jobs:
  terminal-journal:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project-state schema validator
        run: python -m pip install -r requirements-dev.txt
      - name: Run terminal journal, capsule, and project-state contract tests
        run: python -m unittest tests.test_terminal_journal tests.test_recovery_capsule tests.test_recovery_project_state tests.test_recovery_state_audit tests.test_recovery_state_refresh tests.test_recovery_brief -v
